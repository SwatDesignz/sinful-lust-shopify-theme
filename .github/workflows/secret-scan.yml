on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.93.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
