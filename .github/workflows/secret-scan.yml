on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.93.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
