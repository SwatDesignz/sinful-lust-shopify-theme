on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.93.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
